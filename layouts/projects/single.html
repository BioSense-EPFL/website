{{ define "main" }}

<section class="page-hero">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <div class="divider"></div>
    {{ with .Params.subtitle }}<p style="margin-top:1.25rem">{{ . }}</p>{{ end }}
  </div>
</section>

<section class="project-content">
  <div class="container">
    {{ .Content }}
  </div>
</section>

{{ end }}
